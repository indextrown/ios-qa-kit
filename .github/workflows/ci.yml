# PR·push마다: 파이썬 컴파일·단위 테스트, UI 빌드 결과(ui/dist)가 소스와 같고 모두 커밋됐는지.
# 시뮬레이터·Xcode가 필요한 확인(실제 실행)은 여기서 하지 않는다 — 시범 앱에서 손으로.
name: CI
on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: system }   # 맥 기본 /usr/bin/python3 (3.9) — 맥 앱이 이걸로 돈다, 3.10 이상 문법 금지
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}
      - name: 파이썬 고르기
        run: echo "PY=$([ '${{ matrix.python }}' = system ] && echo /usr/bin/python3 || echo python)" >> "$GITHUB_ENV"
      - name: 컴파일
        run: $PY --version && $PY -m py_compile bin/qakit lib/qakit/*.py Tools/gen-ids/gen_ids.py Tools/scenario/scenario_tools.py
      - name: 단위 테스트
        run: $PY -m unittest discover -s tests -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: UI 빌드
        working-directory: web
        run: npm ci && npm run build
      - name: ui/dist가 소스와 같고 모두 커밋됐는지
        run: |
          if [ -n "$(git status --porcelain ui/dist)" ]; then
            echo "::error::ui/dist가 web/ 소스와 다릅니다 — cd web && npm run build 뒤 ui/dist까지 커밋하세요"
            git status --porcelain ui/dist
            exit 1
          fi
          for f in $(grep -o 'assets/[^"]*' ui/dist/index.html); do
            git ls-files --error-unmatch "ui/dist/$f" >/dev/null || { echo "::error::커밋 안 된 빌드 파일: ui/dist/$f"; exit 1; }
          done

  mac-app:   # 맥 앱 셸(App/)이 컴파일되고 번들·DMG가 만들어지는지 (켜 보는 확인은 손으로)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 앱·DMG 만들기
        run: scripts/build-dmg.sh
      - name: 번들 확인
        run: |
          APP="dist/QA Kit.app"
          lipo -archs "$APP/Contents/MacOS/QAKit"
          plutil -lint "$APP/Contents/Info.plist"
          test -x "$APP/Contents/Resources/kit/bin/qakit"
          test -f "$APP/Contents/Resources/kit/ui/dist/index.html"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          codesign --verify --strict "$APP"
          /usr/bin/python3 "$APP/Contents/Resources/kit/bin/qakit" --version
          hdiutil verify "dist/QA-Kit-$(cat VERSION).dmg"
